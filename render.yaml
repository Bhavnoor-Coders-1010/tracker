services:
  - type: web
    name: tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_DATA_REPO
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TEXT_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TTS_FALLBACK_MODEL
        value: gemini-2.5-pro-preview-tts
      - key: GEMINI_HTTP_TIMEOUT_MS
        value: "120000"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_CHAT
        sync: false
